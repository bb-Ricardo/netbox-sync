[project]
name = "netbox-sync"
version = "1.9.0"
description = "Sync objects from various sources to NetBox"
authors = [
    { name = "Ricardo Bartels", email = "ricardo.bartels@telekom.de" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
dependencies = [
    "aiodns==4.0.4",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "hcloud==2.25.1",
    "idna==3.20",
    "packaging==26.3",
    "pycares==5.0.1",
    "pycparser==3.0",
    "python-dateutil==2.9.0.post0",
    "pyvmomi==9.1.1.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "setuptools==84.0.0",
    "six==1.17.0",
    "urllib3==2.8.0",
    "wheel==0.48.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]

[project.urls]
Repository = "https://github.com/bb-ricardo/netbox-sync.git"
Issues = "https://github.com/bb-ricardo/netbox-sync/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# the modules under test live in the repository root, which plain `pytest` does
# not put on sys.path (unlike `python -m pytest`)
pythonpath = ["."]
